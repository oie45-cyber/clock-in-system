<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安心商業銀行 AI 導入規劃與智慧金融平台</title>
<style>body{font-family:Arial,'Noto Sans TC',sans-serif;background:#0f172a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center;padding:32px}.spin{width:34px;height:34px;border:4px solid #334155;border-top-color:#38bdf8;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="spin"></div><div id="status">安心商業銀行 AI 專題頁面載入中…</div></div>
<script>
(async()=>{
  try{
    const files=[0,1,2,3,4,5].map(i=>`anxin-bank-ai-data/part${i}.txt`);
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(`載入 ${f} 失敗`);
      return await r.text();
    }));
    const b64=parts.join('').replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('status').innerHTML='頁面載入失敗，請使用最新版 Chrome、Edge 或 Safari 重新開啟。<br><small>'+e.message+'</small>';
    console.error(e);
  }
})();
</script>
</body>
</html>
